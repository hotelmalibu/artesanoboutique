<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arte'Sano — Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap" />
<style>
  :root {
    --tinta: #4A3F35; --verde: #7C8B5D; --verde-osc: #5F6D45; --beige: #C9A876; --crema: #F5EDE0; --blush: #E8C9C0;
    --blanco: #ffffff; --linea: #E6DCC8; --gris: #8A7F72; --alerta: #B8553F;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(1000px 500px at 50% -10%, #fff 0%, var(--crema) 60%), var(--crema); color: var(--tinta); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .tarjeta { width: 100%; max-width: 400px; background: var(--blanco); border: 1px solid var(--linea); border-radius: 18px; box-shadow: 0 24px 60px rgba(74,63,53,.10); padding: 34px 32px 30px; text-align: center; }
  .logo { width: 96px; height: 96px; margin: 0 auto 8px; }
  .titulo { font-size: 13px; letter-spacing: .24em; text-transform: uppercase; color: var(--verde); font-weight: 700; }
  .sub { font-size: 13px; color: var(--gris); margin: 6px 0 22px; }
  form { text-align: left; }
  label { display: block; font-size: 12.5px; font-weight: 600; margin: 14px 0 6px; }
  input { width: 100%; padding: 12px 13px; border: 1px solid var(--linea); border-radius: 10px; font-size: 15px; color: var(--tinta); background: #fcfaf5; }
  input:focus { outline: 2px solid var(--verde); border-color: transparent; background: #fff; }
  .btn { width: 100%; margin-top: 22px; padding: 13px; border: none; border-radius: 11px; background: linear-gradient(135deg, #93A272, var(--verde) 55%, var(--verde-osc)); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn:disabled { opacity: .6; cursor: default; }
  .error { margin-top: 16px; min-height: 18px; color: var(--alerta); font-size: 13px; font-weight: 600; text-align: center; }
  .pie { margin-top: 20px; font-size: 11px; color: var(--gris); letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="tarjeta">
    <svg class="logo" viewBox="0 0 100 100" aria-label="Arte'Sano">
      <circle cx="50" cy="50" r="48" fill="#F5EDE0"/>
      <path d="M22 68c1-11 6-20 17-26" fill="none" stroke="#5F6D45" stroke-width="2" stroke-linecap="round"/>
      <g fill="#5F6D45">
        <ellipse cx="25" cy="63" rx="4.6" ry="2.1" transform="rotate(-42 25 63)"/>
        <ellipse cx="29.5" cy="56.5" rx="5.1" ry="2.3" transform="rotate(-34 29.5 56.5)"/>
        <ellipse cx="34" cy="50.5" rx="5.6" ry="2.5" transform="rotate(-26 34 50.5)"/>
        <ellipse cx="38.5" cy="45" rx="6" ry="2.6" transform="rotate(-16 38.5 45)"/>
      </g>
      <text x="33" y="67" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="44" fill="#5F6D45">A</text>
      <text x="49" y="73" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="33" fill="#5F6D45">S</text>
    </svg>
    <div class="titulo">Panel Arte'Sano</div>
    <div class="sub">Ingresa para administrar la tienda</div>
    <form id="form">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" type="text" autocomplete="username" placeholder="admin" required />
      <label for="clave">Contraseña</label>
      <input id="clave" name="clave" type="password" autocomplete="current-password" placeholder="••••••••" required />
      <div id="paso2" style="display:none;">
        <label for="codigo">Código de verificación (app de autenticación)</label>
        <input id="codigo" name="codigo" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="123456" />
      </div>
      <button class="btn" id="btn" type="submit">Ingresar</button>
      <div class="error" id="error"></div>
    </form>
    <div class="pie">artesanoboutique.com</div>
  </div>
<script>
  const form = document.getElementById('form'), err = document.getElementById('error'), btn = document.getElementById('btn');
  const paso2 = document.getElementById('paso2'), codigo = document.getElementById('codigo');
  fetch('/admin/login/estado').then((r) => r.json()).then((d) => { if (d.requiereCodigo) paso2.style.display = 'block'; }).catch(() => {});
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); err.textContent = ''; btn.disabled = true;
    try {
      const r = await fetch('/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario: document.getElementById('usuario').value.trim(), clave: document.getElementById('clave').value, codigo: codigo.value.trim() }) });
      const data = await r.json().catch(() => ({}));
      if (data.ok) window.location.href = '/admin';
      else { if (data.requiereCodigo) { paso2.style.display = 'block'; codigo.focus(); } err.textContent = data.error || 'Usuario o contraseña incorrectos.'; }
    } catch (_) { err.textContent = 'Error de red. Intenta de nuevo.'; }
    finally { btn.disabled = false; }
  });
</script>
</body>
</html>
