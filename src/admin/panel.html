<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arte'Sano — Panel administrativo</title>
<link rel="icon" href="/publico/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="/publico/favicon.svg" />
<link rel="apple-touch-icon" href="/publico/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" />
<style>
  :root {
    --tinta: #3F352C; --tinta-2: #5C5147; --verde: #7C8B5D; --verde-osc: #5F6D45; --verde-suave: #EDF1E4; --verde-tenue: #F5F7EF;
    --beige: #C9A876; --crema: #F7F1E6; --crema-osc: #EFE6D6; --blush: #E8C9C0; --blanco: #fff; --linea: #E7DFD0; --linea-2: #F0EAE0;
    --gris: #8A7F72; --gris-2: #B3A99C; --alerta: #B8553F; --alerta-suave: #F9E4DF; --ok: #3F8A55; --ok-suave: #E1F1E5; --aviso: #B77C1E; --aviso-suave: #FBEFD6; --info: #4E6FA3; --info-suave: #E5ECF7;
    --radio: 14px; --radio-sm: 10px; --sombra: 0 1px 2px rgba(63,53,44,.04), 0 8px 24px -12px rgba(63,53,44,.18);
    --sans: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; --serif: "Playfair Display", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--crema); color: var(--tinta); font: 15px/1.5 var(--sans); }
  a { color: var(--verde-osc); text-decoration: none; } a:hover { text-decoration: underline; }
  svg.ico { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
  .app { display: grid; grid-template-columns: 256px 1fr; min-height: 100vh; }

  /* ---- Barra superior (solo móvil) ---- */
  .topbar { display: none; position: sticky; top: 0; z-index: 40; background: #fff; border-bottom: 1px solid var(--linea); padding: 9px 14px; align-items: center; gap: 10px; }
  .topbar .marca { padding: 0; }
  .topbar .btn-icono { margin-left: auto; }

  /* ---- Menú lateral ---- */
  aside { background: #fff; border-right: 1px solid var(--linea); padding: 20px 14px 16px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; overflow: auto; }
  .marca { display: flex; align-items: center; gap: 12px; padding: 4px 8px 14px; }
  .marca svg { width: 42px; height: 42px; flex: none; }
  .marca b { display: block; font: italic 600 19px/1.1 var(--serif); color: var(--verde-osc); }
  .marca small { display: block; font-size: 11px; color: var(--gris); text-transform: uppercase; letter-spacing: .14em; margin-top: 3px; }
  nav { flex: 1; }
  .nav-grupo { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gris-2); padding: 14px 12px 5px; }
  nav button { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: none; border: none; padding: 9px 12px; border-radius: var(--radio-sm); font: 500 14.5px/1.3 var(--sans); color: var(--tinta-2); cursor: pointer; position: relative; transition: background .12s, color .12s; }
  nav button .ico { color: var(--gris); }
  nav button:hover { background: var(--crema); color: var(--tinta); }
  nav button.activo { background: var(--verde-suave); color: var(--verde-osc); font-weight: 600; }
  nav button.activo .ico { color: var(--verde-osc); }
  nav button.activo::before { content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--verde); }
  .badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--alerta); color: #fff; font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .salir { border-top: 1px solid var(--linea-2); margin-top: 12px; padding-top: 12px; font-size: 13px; color: var(--gris); display: flex; flex-direction: column; gap: 7px; }
  .salir a, .salir span { display: inline-flex; align-items: center; gap: 8px; }
  .salir .ico { width: 15px; height: 15px; }

  /* ---- Contenido ---- */
  main { padding: 28px 34px 40px; max-width: 1480px; width: 100%; min-width: 0; }
  .cabecera { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  h1 { font: 600 27px/1.2 var(--serif); margin: 0 0 4px; }
  .sub { color: var(--gris); margin-bottom: 20px; font-size: 14.5px; }
  .cabecera .sub { margin-bottom: 0; }
  h2 { font: 600 16px/1.3 var(--sans); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .panel h2 .ico { color: var(--verde); }
  .tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .tarjeta { background: #fff; border: 1px solid var(--linea); border-radius: var(--radio); padding: 18px 20px; box-shadow: var(--sombra); position: relative; }
  .tarjeta .k { font-size: 12.5px; font-weight: 600; color: var(--gris); letter-spacing: .02em; padding-right: 44px; }
  .tarjeta .v { font-size: 28px; font-weight: 700; margin-top: 6px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .tarjeta .d { font-size: 13px; color: var(--gris); margin-top: 4px; }
  .tarjeta .icono { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 10px; background: var(--verde-tenue); color: var(--verde-osc); display: flex; align-items: center; justify-content: center; }
  .tarjeta .icono.alerta { background: var(--alerta-suave); color: var(--alerta); }
  .tarjeta .icono.aviso { background: var(--aviso-suave); color: var(--aviso); }
  .tarjeta .icono.info { background: var(--info-suave); color: var(--info); }
  .panel { background: #fff; border: 1px solid var(--linea); border-radius: var(--radio); padding: 20px 22px; margin-bottom: 18px; box-shadow: var(--sombra); overflow-x: auto; }
  .barra-progreso { background: var(--crema-osc); border-radius: 999px; height: 12px; overflow: hidden; }
  .barra-progreso-r { background: linear-gradient(90deg, #93A272, var(--verde)); height: 100%; border-radius: 999px; transition: width .4s; }
  .canal-fila { display: grid; grid-template-columns: 150px 1fr 56px; align-items: center; gap: 12px; padding: 7px 0; font-size: 14px; }
  .canal-fila .barra-progreso { height: 10px; }
  .etapa-fila { margin-bottom: 12px; }
  .etapa-fila .cab { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
  .caliente { border: 1px solid var(--linea); border-radius: var(--radio-sm); padding: 12px 14px; margin-bottom: 8px; cursor: pointer; transition: border-color .12s, background .12s; }
  .caliente:hover { border-color: var(--verde); background: var(--verde-tenue); }
  .caliente .cab { display: flex; justify-content: space-between; font-size: 14px; gap: 10px; }
  .caliente .txt { font-size: 13.5px; color: var(--gris); margin-top: 4px; }

  /* ---- Tablas ---- */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--linea-2); vertical-align: middle; }
  th { font-size: 12px; color: var(--gris); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
  tbody tr:last-child td { border-bottom: none; }
  tr:hover td { background: #FCFAF6; }
  .fila-click { cursor: pointer; }
  td small, .tarjeta small { color: var(--gris); }

  /* ---- Chips ---- */
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--crema-osc); color: var(--tinta-2); white-space: nowrap; line-height: 1.4; }
  .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .8; }
  .chip.publicado, .chip.pagado, .chip.entregado, .chip.ok { background: var(--ok-suave); color: var(--ok); }
  .chip.borrador, .chip.pendiente_pago, .chip.humano { background: var(--aviso-suave); color: var(--aviso); }
  .chip.archivado, .chip.cancelado, .chip.rechazado, .chip.reembolsado, .chip.no { background: var(--alerta-suave); color: var(--alerta); }
  .chip.enviado, .chip.en_preparacion { background: var(--info-suave); color: var(--info); }
  .chip.bot { background: var(--verde-suave); color: var(--verde-osc); }

  /* ---- Botones y campos ---- */
  .barra { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 15px; border-radius: var(--radio-sm); border: 1px solid var(--linea); background: #fff; color: var(--tinta); font: 600 14px/1.2 var(--sans); cursor: pointer; transition: background .12s, border-color .12s, transform .06s; white-space: nowrap; }
  .btn .ico { width: 16px; height: 16px; }
  .btn:hover { background: var(--crema); border-color: #D9CFBD; }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 3px solid rgba(124,139,93,.35); outline-offset: 1px; }
  .btn.primario { background: var(--verde); border-color: var(--verde); color: #fff; }
  .btn.primario:hover { background: var(--verde-osc); border-color: var(--verde-osc); }
  .btn.exito { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.exito:hover { background: #33734A; border-color: #33734A; }
  .btn.peligro { color: var(--alerta); border-color: #EBC9C0; background: #fff; }
  .btn.peligro:hover { background: var(--alerta-suave); }
  .btn.fantasma { border-color: transparent; background: transparent; color: var(--verde-osc); }
  .btn.fantasma:hover { background: var(--verde-tenue); }
  .btn:disabled { opacity: .5; cursor: default; transform: none; }
  .btn.mini { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
  .btn.mini .ico { width: 14px; height: 14px; }
  .btn-icono { width: 38px; height: 38px; padding: 0; border-radius: 10px; }
  input, select, textarea { padding: 10px 12px; border: 1px solid var(--linea); border-radius: var(--radio-sm); font: 400 14.5px/1.4 var(--sans); color: var(--tinta); background: #FCFAF6; transition: border-color .12s, box-shadow .12s, background .12s; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--verde); box-shadow: 0 0 0 3px rgba(124,139,93,.18); background: #fff; }
  textarea { width: 100%; min-height: 84px; resize: vertical; }
  .campo { display: flex; flex-direction: column; gap: 6px; }
  .campo label { font-size: 12.5px; font-weight: 600; color: var(--gris); }
  .campo small { font-size: 12.5px; color: var(--gris); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .buscador { position: relative; min-width: 260px; flex: 1; max-width: 420px; }
  .buscador .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--gris); width: 16px; height: 16px; }
  .buscador input { width: 100%; padding-left: 36px; }

  /* ---- Modal ---- */
  .modal-fondo { position: fixed; inset: 0; background: rgba(63,53,44,.5); display: none; align-items: flex-start; justify-content: center; padding: 30px 16px; overflow: auto; z-index: 50; }
  .modal-fondo.abierto { display: flex; }
  .modal { background: #fff; border-radius: 18px; width: 100%; max-width: 1000px; padding: 26px 28px; box-shadow: 0 30px 80px rgba(0,0,0,.28); animation: subir .18s ease-out; }
  @keyframes subir { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal h2 { font: 600 22px/1.2 var(--serif); margin: 0 0 16px; flex-wrap: wrap; }
  .modal-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .modal-cab h2 { margin: 0; }
  .seccion { border-top: 1px solid var(--linea-2); margin-top: 18px; padding-top: 16px; }
  .seccion h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--verde-osc); margin: 0 0 12px; display: flex; align-items: center; gap: 7px; }
  .seccion h3 .ico { width: 15px; height: 15px; }
  .acciones-rapidas { display: flex; gap: 10px; flex-wrap: wrap; }
  .historial { display: flex; flex-direction: column; gap: 8px; }
  .historial div { display: grid; grid-template-columns: 150px auto 1fr; gap: 10px; font-size: 13.5px; align-items: center; }
  .miniaturas { display: flex; gap: 10px; flex-wrap: wrap; }
  .miniatura { position: relative; width: 92px; height: 92px; border-radius: 10px; overflow: hidden; border: 1px solid var(--linea); background: var(--crema); }
  .miniatura img { width: 100%; height: 100%; object-fit: cover; }
  .miniatura button { position: absolute; top: 3px; right: 3px; background: rgba(0,0,0,.55); color: #fff; border: none; border-radius: 6px; font-size: 11px; cursor: pointer; }
  .miniatura .principal { position: absolute; bottom: 0; left: 0; right: 0; background: var(--verde); color: #fff; font-size: 10px; text-align: center; }
  .dropzone { border: 2px dashed var(--linea); border-radius: 12px; padding: 18px; text-align: center; color: var(--gris); font-size: 14px; cursor: pointer; }
  .dropzone.sobre { border-color: var(--verde); background: var(--verde-suave); }
  .aviso { background: var(--aviso-suave); border: 1px solid #EFD9A8; color: #7A5A12; padding: 11px 14px; border-radius: var(--radio-sm); font-size: 14px; margin-bottom: 12px; }
  .error { color: var(--alerta); font-weight: 600; font-size: 13.5px; min-height: 18px; }
  .exito { color: var(--ok); font-weight: 600; font-size: 13.5px; }
  .img-lista { width: 46px; height: 46px; border-radius: 9px; object-fit: cover; background: var(--crema); border: 1px solid var(--linea); }
  .pill-int { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; background: var(--crema); font-size: 13px; font-weight: 500; margin: 0 8px 8px 0; }
  .pill-int i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--alerta); }
  .pill-int.ok i { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-suave); }
  .detalle-pedido dt { font-size: 12px; color: var(--gris); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
  .detalle-pedido dd { margin: 3px 0 12px; }
  code { background: var(--crema); padding: 2px 7px; border-radius: 6px; font-size: 12.5px; }
  .vacio { padding: 26px 10px; text-align: center; color: var(--gris); font-size: 14px; }
  .vacio .ico { width: 26px; height: 26px; color: var(--gris-2); display: block; margin: 0 auto 6px; }

  /* ---- Chat / WhatsApp ---- */
  .chat { display: grid; grid-template-columns: 320px 1fr; gap: 0; padding: 0; overflow: hidden; }
  .chat-lista { border-right: 1px solid var(--linea); overflow: auto; max-height: 720px; }
  .chat-lista-cab { padding: 12px 14px; border-bottom: 1px solid var(--linea-2); position: sticky; top: 0; background: #fff; z-index: 1; }
  .chat-lista-cab .buscador { min-width: 0; max-width: none; }
  .chat-item { display: grid; grid-template-columns: 42px 1fr auto; gap: 11px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--linea-2); cursor: pointer; transition: background .12s; }
  .chat-item:hover { background: #FCFAF6; }
  .chat-item.activo { background: var(--verde-suave); }
  .chat-item > div { min-width: 0; }
  .chat-item .nombre { font-weight: 600; font-size: 14.5px; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .chat-item .nombre span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-item .ultimo { font-size: 13px; color: var(--gris); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .chat-item .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; font-size: 11.5px; color: var(--gris); }
  .avatar { width: 42px; height: 42px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #fff; flex: none; }
  .chat-cuerpo { display: flex; flex-direction: column; min-width: 0; }
  .chat-cab { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--linea-2); flex-wrap: wrap; }
  .chat-cab .quien { flex: 1; min-width: 160px; }
  .chat-cab .quien b { display: block; font-size: 15.5px; }
  .chat-cab .quien small { color: var(--gris); font-size: 12.5px; }
  .pedidos-chat { display: flex; gap: 10px; padding: 12px 18px; overflow-x: auto; border-bottom: 1px solid var(--linea-2); background: #FCFAF6; }
  .pedido-mini { flex: none; width: 290px; background: #fff; border: 1px solid var(--linea); border-radius: 12px; padding: 12px 14px; }
  .nowrap { white-space: nowrap; }
  .pedido-mini .cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .pedido-mini .cab b { font-size: 14px; }
  .pedido-mini .info { font-size: 13px; color: var(--gris); margin-bottom: 10px; }
  .pedido-mini .acciones { display: flex; gap: 6px; flex-wrap: wrap; }
  .burbujas { flex: 1; overflow: auto; padding: 16px 18px; background: var(--crema); display: flex; flex-direction: column; gap: 6px; min-height: 320px; max-height: 470px; }
  .burbuja { max-width: 72%; padding: 9px 13px; border-radius: 14px; font-size: 14px; white-space: pre-wrap; word-break: break-word; box-shadow: 0 1px 1px rgba(63,53,44,.05); }
  .burbuja small { display: block; color: var(--gris); font-size: 11.5px; margin-bottom: 3px; }
  .burbuja.in { background: #fff; align-self: flex-start; border-bottom-left-radius: 4px; }
  .burbuja.out { background: var(--verde-suave); align-self: flex-end; border-bottom-right-radius: 4px; }
  .burbuja.out.tienda { background: #DCE8F8; }
  .respuestas-rapidas { display: flex; gap: 8px; padding: 10px 18px 0; flex-wrap: wrap; }
  .respuestas-rapidas button { border: 1px solid var(--linea); background: #fff; border-radius: 999px; padding: 5px 12px; font: 500 13px var(--sans); color: var(--tinta-2); cursor: pointer; }
  .respuestas-rapidas button:hover { border-color: var(--verde); color: var(--verde-osc); }
  .compositor { display: flex; gap: 10px; padding: 12px 18px 16px; align-items: flex-end; }
  .compositor textarea { flex: 1; min-height: 44px; max-height: 140px; resize: none; }
  .compositor .btn { height: 44px; }

  /* ---- Toast ---- */
  #toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
  .toast { background: var(--tinta); color: #fff; padding: 11px 16px; border-radius: 12px; font-size: 14px; display: flex; align-items: center; gap: 9px; box-shadow: 0 12px 30px rgba(0,0,0,.25); animation: subir .18s ease-out; }
  .toast.ok { background: var(--ok); } .toast.error { background: var(--alerta); }

  @media (max-width: 1100px) { .chat { grid-template-columns: 280px 1fr; } }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .topbar { display: flex; }
    aside { display: none; position: fixed; inset: 58px 0 0 0; height: auto; z-index: 39; border-right: none; }
    .app.nav-abierto aside { display: flex; }
    main { padding: 18px 16px 30px; }
    h1 { font-size: 23px; }
    .grid2, .grid3, .grid4 { grid-template-columns: 1fr; }
    .chat { grid-template-columns: 1fr; }
    .chat-lista { max-height: 300px; border-right: none; border-bottom: 1px solid var(--linea); }
    .chat.con-abierto .chat-lista { display: none; }
    .burbuja { max-width: 88%; }
    .modal { padding: 20px 16px; }
    .historial div { grid-template-columns: 1fr; gap: 2px; }
  }
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true"><symbol id="logo-as" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="48" fill="#F5EDE0"/>
  <path d="M22 68c1-11 6-20 17-26" fill="none" stroke="#5F6D45" stroke-width="2" stroke-linecap="round"/>
  <g fill="#5F6D45">
    <ellipse cx="25" cy="63" rx="4.6" ry="2.1" transform="rotate(-42 25 63)"/>
    <ellipse cx="29.5" cy="56.5" rx="5.1" ry="2.3" transform="rotate(-34 29.5 56.5)"/>
    <ellipse cx="34" cy="50.5" rx="5.6" ry="2.5" transform="rotate(-26 34 50.5)"/>
    <ellipse cx="38.5" cy="45" rx="6" ry="2.6" transform="rotate(-16 38.5 45)"/>
  </g>
  <text x="33" y="67" font-family="'Playfair Display',Georgia,serif" font-style="italic" font-weight="600" font-size="44" fill="#5F6D45">A</text>
  <text x="49" y="73" font-family="'Playfair Display',Georgia,serif" font-style="italic" font-weight="600" font-size="33" fill="#5F6D45">S</text>
</symbol></svg>
<div class="app" id="app">
  <header class="topbar">
    <div class="marca"><svg><use href="#logo-as"/></svg><div><b>Arte'Sano</b><small>Panel</small></div></div>
    <button class="btn btn-icono" id="btn-menu" aria-label="Abrir menú"><i data-ico="menu"></i></button>
  </header>
  <aside>

function toast(msg, tipo = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + tipo;
  t.innerHTML = ico(tipo === 'error' ? 'alert' : 'check') + esc(msg);
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
async function api(ruta, opciones) {
  const r = await fetch('/admin/api' + ruta, { headers: { 'Content-Type': 'application/json' }, ...opciones });
  if (r.status === 401) { window.location.href = '/admin/login'; return {}; }
  return r.json().catch(() => ({ ok: false, error: 'Respuesta inválida' }));
}

let VISTA = 'resumen';
function ir(v) {
  detenerChat();

function badgeWa(n) { const b = $('#badge-wa'); if (!b) return; b.textContent = n; b.style.display = n ? '' : 'none'; }
/** Vuelve a pintar la vista actual sin perder el chat abierto. */
async function refrescarVista() {

}

async function resumen() {

  const pill = (ok, n) => `<span class="pill-int ${ok ? 'ok' : ''}"><i></i>${n}</span>`;
  const usd = (x) => (x.USD ? ' · US$ ' + x.USD.toFixed(2) : '');
  const tarjeta = (k, val, det, icono, cls = '') => `<div class="tarjeta"><div class="icono ${cls}">${ico(icono)}</div><div class="k">${k}</div><div class="v">${val}</div><div class="d">${det}</div></div>`;

    <div class="cabecera"><div><h1>Resumen</h1><div class="sub">Así va ${esc(d.tienda)} hoy.</div></div>
      <div class="barra" style="margin:0"><button class="btn" onclick="resumen()">${ico('refresh')} Actualizar</button><button class="btn primario" onclick="ir('pedidos')">${ico('bag')} Ver pedidos</button></div></div>

      ${tarjeta('Ventas hoy', cop(v.hoy.COP), `${v.hoy.pedidos} pedidos${usd(v.hoy)}`, 'dollar')}
      ${tarjeta('Esta semana', cop(v.semana.COP), `${v.semana.pedidos} pedidos${usd(v.semana)}`, 'trending')}
      ${tarjeta('Este mes', cop(v.mes.COP), `${v.mes.pedidos} pedidos${usd(v.mes)}`, 'calendar')}
      ${tarjeta('Por preparar', v.porPreparar, `${v.pendientesPago} pendientes de pago · ${v.programados} programados`, 'package', v.porPreparar ? 'aviso' : '')}
      ${tarjeta('Catálogo', c.publicados, `publicados · ${c.borradores} borradores · ${c.bajoStock} con bajo stock`, 'layers', c.bajoStock ? 'alerta' : 'info')}
    </div>
    <div class="panel"><h2>${ico('activity')} Integraciones</h2>
      ${pill(i.db, 'PostgreSQL')}${pill(i.rapyd, 'RAPYD' + (i.rapydSandbox && i.rapyd ? ' (sandbox)' : ''))}${pill(i.resend, 'Resend')}${pill(i.whatsapp, 'WhatsApp')}${pill(i.ia, 'Claude (IA)')}${i.cloudinary ? pill(true, 'Cloudinary') : ''}
      <div class="sub" style="margin:8px 0 0">URL pública: <code>${esc(i.publicUrl)}</code></div>
    </div>
    <div class="grid2">
      <div class="panel"><h2>${ico('bag')} Últimos pedidos</h2>
        <table><thead><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Estado</th></tr></thead><tbody>
        ${d.ultimosPedidos.map((p) => `<tr class="fila-click" onclick="verPedido(${p.id})"><td><b class="nowrap">${esc(p.numero)}</b><br><small>${fecha(p.creado)}</small></td><td>${esc(p.cliente)}</td><td>${dinero(p.total, p.moneda)}</td><td><span class="chip ${p.estado}">${esc(p.estadoNombre)}</span></td></tr>`).join('') || `<tr><td colspan="4"><div class="vacio">${ico('inbox')}Aún no hay pedidos.</div></td></tr>`}
        </tbody></table></div>
      <div class="panel"><h2>${ico('alert')} Bajo stock</h2>
        <table><thead><tr><th>Producto</th><th>SKU</th><th>Stock</th></tr></thead><tbody>
        ${d.bajoStock.map((b) => `<tr class="fila-click" onclick="editarProducto(${b.productoId})"><td>${esc(b.producto)} · ${esc(b.variante)}</td><td><code>${esc(b.sku)}</code></td><td><b style="color:var(--alerta)">${b.stock}</b></td></tr>`).join('') || `<tr><td colspan="3"><div class="vacio">${ico('check')}Todo con stock suficiente.</div></td></tr>`}
        </tbody></table></div>
    </div>`;
}

  const d = await api('/financiero');
  const m = d.meta;
  const barraPct = Math.min(100, d.progresoPct);
  main.innerHTML = `
    <h1>Modelo financiero</h1><div class="sub">Meta de ventas, costo estimado y margen por producto. Solo lo ves tú: no aparece en la tienda pública.</div>
    <div class="tarjetas">
      <div class="tarjeta"><div class="k">Meta de ventas mensual</div><div class="v">${cop(m.metaMensualCop)}</div><div class="d">Se mide contra ingresos, no contra utilidad · costo ${100 - m.margenObjetivoPct}% del precio</div></div>
      <div class="tarjeta"><div class="k">Ventas este mes</div><div class="v">${cop(d.ventasMesCop)}</div><div class="d">${d.pedidosMes} pedidos</div></div>
      <div class="tarjeta"><div class="k">Progreso hacia la meta de ventas</div><div class="v">${d.progresoPct}%</div><div class="d">${d.faltanteCop > 0 ? 'Faltan ' + cop(d.faltanteCop) + ' en ventas' : '¡Meta de ventas alcanzada!'}</div></div>
      <div class="tarjeta"><div class="k">Utilidad (margen bruto) del mes</div><div class="v">${cop(d.margenMesCop)}</div><div class="d">Al ${m.margenObjetivoPct}% de margen, la meta de ventas equivale a ${cop(Math.round(m.metaMensualCop * m.margenObjetivoPct / 100))} de utilidad</div></div>
    </div>
    <div class="panel"><div class="barra-progreso"><div class="barra-progreso-r" style="width:${barraPct}%"></div></div></div>
    <div class="panel"><h2>Meta y costo por defecto</h2><div class="grid2">
      <div class="campo"><label>Meta de ventas mensual (COP)</label><input id="f-meta" type="number" min="0" step="1000" value="${m.metaMensualCop}"></div>
      <div class="campo"><label>Margen objetivo por defecto (%)</label><input id="f-margen" type="number" min="1" max="95" value="${m.margenObjetivoPct}"><small>El costo por defecto de cada producto es ${100 - m.margenObjetivoPct}% del precio, salvo que le fijes un costo propio al editarlo.</small></div></div>
      <div class="barra" style="margin-top:10px"><button class="btn primario" onclick="guardarMetaFinanciera()">Guardar meta</button><span class="error" id="f-error"></span></div></div>
    <div class="tarjetas">
      <div class="tarjeta"><div class="k">Plan: unidades a vender en el mes</div><div class="v">${d.plan.unidades.toLocaleString('es-CO')}</div><div class="d">Entre todos los productos, según el reparto de abajo</div></div>
      <div class="tarjeta"><div class="k">Ventas del plan</div><div class="v">${cop(d.plan.ventasCop)}</div><div class="d">Meta: ${cop(m.metaMensualCop)}</div></div>
      <div class="tarjeta"><div class="k">Utilidad esperada del plan</div><div class="v">${cop(d.plan.margenCop)}</div><div class="d">Con el costo estimado de cada producto</div></div>
    </div>
    <div class="panel"><h2>Reparto de la meta entre productos</h2>
      <div class="sub">Cada producto aporta una parte de la meta de ventas. Las unidades salen de esa parte dividida entre el <b>precio</b>. Por defecto es en partes iguales; cambia los % y se ajustan solos para sumar 100%.</div>
      <table><thead><tr><th>Producto</th><th>Precio</th><th>Margen</th><th>% de la meta</th><th>Ventas meta</th><th>Unidades meta</th><th>Vendidas este mes</th><th>Avance</th></tr></thead><tbody>
      ${d.productos.map((p) => `<tr><td class="fila-click" onclick="editarProducto(${p.id})">${esc(p.nombre)}<br><small class="sub">${esc(p.categoria)}</small></td><td>${cop(p.precio)}</td><td>${cop(p.margenCop)} · ${p.margenPct}%</td><td><input class="f-part" data-slug="${esc(p.slug)}" type="number" min="0" step="0.1" value="${p.participacionPct}" style="width:80px"></td><td>${cop(p.metaVentasCop)}</td><td><b>${p.unidadesMeta.toLocaleString('es-CO')}</b></td><td>${p.vendidasMes}</td><td>${p.avanceUnidadesPct}%</td></tr>`).join('') || '<tr><td colspan="8" class="sub">Aún no hay productos publicados.</td></tr>'}
      </tbody></table>
      <div class="barra" style="margin-top:10px"><button class="btn primario" onclick="guardarReparto()">Guardar reparto</button><button class="btn" onclick="repartoIgual()">Partes iguales</button><span class="error" id="f-reparto-error"></span></div>
      <div class="sub" style="margin-top:8px">Referencia: si vendieras <b>un solo producto</b>, la meta completa pediría ${d.productos.length ? 'entre ' + Math.min(...d.productos.filter((p) => p.unidadesSolo).map((p) => p.unidadesSolo)).toLocaleString('es-CO') + ' y ' + Math.max(...d.productos.filter((p) => p.unidadesSolo).map((p) => p.unidadesSolo)).toLocaleString('es-CO') + ' unidades de ese producto' : '—'}. Repartida entre todos, el plan de arriba es el número real. Para un costo real distinto al ${100 - m.margenObjetivoPct}% en un producto, edítalo y usa el campo "Costo".</div>
    </div>`;
}
async function guardarReparto() {
  const participaciones = {};
  document.querySelectorAll('.f-part').forEach((i) => { participaciones[i.dataset.slug] = Number(i.value) || 0; });
  const r = await post('/financiero/reparto', { participaciones });
  if (!r.ok) $('#f-reparto-error').textContent = r.error || 'No se pudo guardar.';
  else financiero();

async function subirImagenes(files) {
  const f = await api('/subidas/firma');
  if (!f.ok) { $('#p-error').textContent = f.error; return; }
  for (const file of files) {
    const fd = new FormData();
    fd.append('file', file); fd.append('api_key', f.apiKey); fd.append('timestamp', f.timestamp); fd.append('signature', f.signature); fd.append('folder', f.folder);
    try {
      const r = await fetch(f.url, { method: 'POST', body: fd }).then((x) => x.json());
      if (r.secure_url) { P.imagenes.push({ url: r.secure_url, alt: $('#p-nombre').value }); pintarImagenes(); }
      else $('#p-error').textContent = r.error?.message || 'No se pudo subir la imagen.';
    } catch (e) { $('#p-error').textContent = 'Error subiendo: ' + e.message; }
  }
}

function etapaFila(lbl, val, total, pct) {
  const w = total ? Math.max(2, Math.round((val / total) * 100)) : 0;
  return `<div class="etapa-fila"><div class="cab"><span>${lbl}</span><b>${val}${pct != null ? ' · ' + pct + '%' : ''}</b></div><div class="barra-progreso"><div class="barra-progreso-r" style="width:${w}%"></div></div></div>`;
}
function qsRango(r) {
  const p = new URLSearchParams();
  if (r?.desde) p.set('desde', r.desde);
  if (r?.hasta) p.set('hasta', r.hasta);
  const s = p.toString();
  return s ? '?' + s : '';
}
let RANGO_MONITOR = {};
function presetMonitor(tipo) {
  const iso = (d) => d.toISOString().slice(0, 10);
  const hoy = new Date();
  if (tipo === 'hoy') RANGO_MONITOR = { desde: iso(hoy), hasta: iso(hoy) };
  else if (tipo === '7') { const d = new Date(hoy); d.setDate(d.getDate() - 6); RANGO_MONITOR = { desde: iso(d), hasta: iso(hoy) }; }
  else if (tipo === '30') { const d = new Date(hoy); d.setDate(d.getDate() - 29); RANGO_MONITOR = { desde: iso(d), hasta: iso(hoy) }; }
  else RANGO_MONITOR = {};
  monitorConversaciones();
}

    if (p.estado === 'pendiente_pago') acc.push(`<button class="btn mini exito" onclick="confirmarManual(${p.id})">${ico('check')} Confirmar</button>`);
    if (p.estado === 'pagado' || p.estado === 'en_preparacion') acc.push(`<button class="btn mini primario" onclick="verPedido(${p.id}).then(prepararEnvio)">${ico('truck')} Enviar</button>`);
    if (p.estado === 'enviado') acc.push(`<button class="btn mini exito" onclick="accionPedido(${p.id}, 'entregado')">${ico('check')} Entregado</button>`);
    if (ESTADOS_ACTIVOS.includes(p.estado)) acc.push(`<button class="btn mini peligro" onclick="cancelarPedido(${p.id})">${ico('x')} Cancelar</button>`);
    acc.push(`<button class="btn mini" onclick="verPedido(${p.id})">${ico('eye')} Ver</button>`);
    return `<div class="pedido-mini"><div class="cab"><b class="nowrap">${esc(p.numero)}</b><span class="chip ${p.estado}">${esc(p.estadoNombre)}</span></div><div class="info">${dinero(p.total, p.moneda)} · ${p.items} ${p.items === 1 ? 'artículo' : 'artículos'}${p.programadoPara ? ' · ' + p.programadoPara : ''}</div><div class="acciones">${acc.join('')}</div></div>`;
  };
  $('#wa-chat').innerHTML = `
    <div class="chat-cab">
      <button class="btn btn-icono" onclick="cerrarChat()" aria-label="Volver" title="Volver a la lista">${ico('undo')}</button>
      ${avatar(WA.nombre, WA.waId)}
      <div class="quien"><b>${esc(WA.nombre || '+' + WA.waId)}</b><small>+${esc(WA.waId)}${WA.canal ? ' · llegó por ' + esc(WA.canal) : ''}</small></div>
      ${WA.modo === 'humano' ? '<span class="chip humano">Lo atiendes tú</span>' : '<span class="chip bot">Atiende Sofía</span>'}
      ${WA.ventanaAbierta ? '<span class="chip ok">ventana 24 h abierta</span>' : '<span class="chip no" title="El cliente debe escribir primero para poder responderle">ventana cerrada</span>'}
      ${WA.modo === 'humano' ? `<button class="btn" onclick="modoChat('bot')">${ico('bot')} Devolver a Sofía</button>` : `<button class="btn primario" onclick="modoChat('humano')">${ico('hand')} Tomar control</button>`}
    </div>
    ${WA.pedidos.length ? `<div class="pedidos-chat">${WA.pedidos.map(pedidoMini).join('')}</div>` : ''}
    <div class="burbujas" id="burbujas">${WA.mensajes.map((m) => `<div class="burbuja ${m.direccion} ${m.autor === 'tienda' ? 'tienda' : ''}"><small>${m.autor === 'cliente' ? esc(WA.nombre || 'Cliente') : m.autor === 'tienda' ? 'Tú' : 'Sofía'} · ${fecha(m.ts)}</small>${esc(m.texto)}</div>`).join('') || `<div class="vacio">${ico('chat')}Sin mensajes todavía.</div>`}</div>
    <div class="respuestas-rapidas">${RESPUESTAS_RAPIDAS.map((t) => `<button type="button" onclick="usarRapida(this.textContent)">${esc(t)}</button>`).join('')}</div>
    <div class="compositor"><textarea id="wa-texto" rows="1" placeholder="${WA.modo === 'humano' ? 'Escribe tu respuesta… (Enter envía, Shift+Enter salto de línea)' : 'Escribe para responder tú (Sofía seguirá activa salvo que tomes el control)'}" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();responderChat();}">${esc(borrador)}</textarea><button class="btn primario" onclick="responderChat()">${ico('send')} Enviar</button></div>
    <div class="error" id="wa-error" style="padding:0 18px 10px"></div>`;
  const b = $('#burbujas'); b.scrollTop = b.scrollHeight;
  clearInterval(WA_TIMER);
  WA_TIMER = setInterval(refrescarChat, 8000);
}
async function refrescarChat() {
  if (!WA || VISTA !== 'whatsapp') return;
  const [d, l] = await Promise.all([api('/conversaciones/' + WA.waId), api('/conversaciones')]);
  if (l.conversaciones) { WA_LISTA = l.conversaciones; pintarListaChats(); badgeWa(WA_LISTA.reduce((n, c) => n + (c.sinLeer || 0), 0)); }
  const firma = (c, ps) => c.mensajes.length + '|' + c.modo + '|' + (ps || []).map((p) => p.id + ':' + p.estado).join(',');
  if (d.ok && firma(d.conversacion, d.pedidos) !== firma(WA, WA.pedidos)) abrirChat(WA.waId);
}
function detenerChat() { clearInterval(WA_TIMER); WA_TIMER = null; WA = null; }
function cerrarChat() { detenerChat(); $('#chat')?.classList.remove('con-abierto'); $('#wa-chat').innerHTML = `<div class="vacio" style="padding:80px 20px">${ico('chat')}Selecciona una conversación para verla aquí.</div>`; pintarListaChats(); }
function usarRapida(t) { const ta = $('#wa-texto'); ta.value = t; ta.focus(); }
async function modoChat(modo) {
  await post(`/conversaciones/${WA.waId}/modo`, { modo });
  toast(modo === 'humano' ? 'Tomaste el control del chat' : 'Sofía vuelve a atender este chat', 'ok');
  abrirChat(WA.waId);
}
async function responderChat() {
  const texto = $('#wa-texto').value.trim();
  if (!texto) return;
  const r = await post(`/conversaciones/${WA.waId}/responder`, { texto });
  if (!r.ok) { $('#wa-error').textContent = r.error; return toast(r.error, 'error'); }
  $('#wa-texto').value = '';
  abrirChat(WA.waId);
}

// ============================================================
//  Ajustes
// ============================================================
async function ajustes() {
  const d = await api('/ajustes');
  const a = d.ajustes;
  main.innerHTML = `<h1>Ajustes</h1><div class="sub">Textos del inicio, tarifas de envío y reglas de pedidos programados.</div>
    <div class="panel"><h2>Inicio</h2><div class="grid2">
      <div class="campo"><label>Título principal</label><input id="i-titulo" value="${esc(a.inicio.titulo)}"></div>
      <div class="campo"><label>Subtítulo</label><input id="i-sub" value="${esc(a.inicio.subtitulo)}"></div></div>
      <div class="barra" style="margin-top:10px"><button class="btn primario" onclick="guardarAjuste('inicio',{titulo:$('#i-titulo').value, subtitulo:$('#i-sub').value})">Guardar</button></div></div>
    <div class="panel"><h2>Envíos</h2><div class="grid3">
      <div class="campo"><label>Tarifa ciudades principales (COP)</label><input id="e-p" type="number" value="${a.envio.tarifaPrincipalCop}"></div>
      <div class="campo"><label>Tarifa resto del país (COP)</label><input id="e-r" type="number" value="${a.envio.tarifaRestoCop}"></div>
      <div class="campo"><label>Transportadora nacional</label><input id="e-tn" value="${esc(a.envio.transportadoraNacional)}"></div>
      <div class="campo"><label>Tiempo ciudades principales</label><input id="e-dp" value="${esc(a.envio.diasPrincipal)}"></div>
      <div class="campo"><label>Tiempo resto del país</label><input id="e-dr" value="${esc(a.envio.diasResto)}"></div>
      <div class="campo"><label>Transportadora internacional</label><input id="e-ti" value="${esc(a.envio.transportadoraInternacional)}"></div>
      <div class="campo" style="grid-column:span 3"><label>Ciudades principales (slugs separados por coma)</label><input id="e-cp" value="${esc(a.envio.ciudadesPrincipales.join(', '))}"></div>
      ${a.envio.zonas.map((z, i) => `<div class="campo"><label>${esc(z.nombre)} · tarifa USD</label><input id="e-z${i}" type="number" step="0.01" value="${z.tarifaUsd}"><small>${esc(z.dias)}</small></div>`).join('')}
    </div><div class="barra" style="margin-top:10px"><button class="btn primario" onclick="guardarEnvio()">Guardar envíos</button></div></div>
    <div class="panel"><h2>Pedidos programados</h2><div class="grid2">
      <div class="campo"><label>Mínimo de días de anticipación</label><input id="pp-min" type="number" value="${a.pedidosProgramados.minDias}"></div>
      <div class="campo"><label>Máximo de días</label><input id="pp-max" type="number" value="${a.pedidosProgramados.maxDias}"></div></div>
      <div class="barra" style="margin-top:10px"><button class="btn primario" onclick="guardarAjuste('pedidosProgramados',{minDias:Number($('#pp-min').value), maxDias:Number($('#pp-max').value)})">Guardar</button></div></div>`;
  window.__envio = a.envio;
}
async function guardarAjuste(clave, valor) { const r = await post('/ajustes', { clave, valor }); if (!r.ok) alert(r.error); else ajustes(); }
function guardarEnvio() {
  const e = { ...window.__envio, tarifaPrincipalCop: Number($('#e-p').value), tarifaRestoCop: Number($('#e-r').value), transportadoraNacional: $('#e-tn').value, diasPrincipal: $('#e-dp').value, diasResto: $('#e-dr').value, transportadoraInternacional: $('#e-ti').value,
    ciudadesPrincipales: $('#e-cp').value.split(',').map((s) => s.trim()).filter(Boolean), zonas: window.__envio.zonas.map((z, i) => ({ ...z, tarifaUsd: Number($('#e-z' + i).value) })) };
  guardarAjuste('envio', e);
}

//  Diagnostico
// ============================================================
async function diagnostico() {
  main.innerHTML = '<h1>Diagnóstico</h1><div class="sub">Probando conexiones…</div>';
  const d = await api('/diagnostico?rapyd=1');
  const i = d.integraciones;
  const fila = (k, v) => `<tr><td>${k}</td><td>${v}</td></tr>`;
  main.innerHTML = `<h1>Diagnóstico</h1><div class="sub">Estado de las integraciones.</div>
    <div class="panel"><table><tbody>
      ${fila('PostgreSQL', d.db.activo ? `<span class="chip ok">activa</span> ${esc(JSON.stringify(d.db.catalogo || {}))} · ${d.db.pedidos} pedidos · ${d.db.mensajes} mensajes` : '<span class="chip no">en memoria</span>')}
      ${fila('RAPYD', d.rapyd ? (d.rapyd.ok ? `<span class="chip ok">${esc(d.rapyd.mensaje)}</span> ${esc(d.rapyd.baseUrl)}` : `<span class="chip no">${esc(d.rapyd.error)}</span>`) : '')}
      ${fila('Métodos de pago (CO/COP)', d.metodosRapyd ? (d.metodosRapyd.ok ? `${d.metodosRapyd.cantidad}: ${esc((d.metodosRapyd.metodos || []).join(', '))}` : esc(d.metodosRapyd.error)) : '')}
      ${fila('Resend', i.resend ? `<span class="chip ok">configurado</span> remitente ${esc(d.correo.remitente)}` : '<span class="chip no">sin API key</span>')}
      ${fila('WhatsApp', i.whatsapp ? '<span class="chip ok">configurado</span>' : '<span class="chip no">sin credenciales</span>')}
      ${fila('Cloudinary', i.cloudinary ? '<span class="chip ok">configurado</span>' : '<span class="chip">opcional · sin usar</span> <small>Las fotos de productos se cargan por URL o desde el repositorio.</small>')}
    </tbody></table></div>
    <div class="panel"><h2>Probar correo</h2><div class="barra"><input id="dg-to" placeholder="correo@destino.com"><button class="btn" onclick="probarCorreo()">Enviar prueba</button><span id="dg-res"></span></div>
      <table><thead><tr><th>Cuándo</th><th>Para</th><th>Asunto</th><th>Resultado</th></tr></thead><tbody>${(d.correo.ultimos || []).map((u) => `<tr><td>${esc(u.cuando)}</td><td>${esc(u.to)}</td><td>${esc(u.subject)}</td><td>${u.ok ? '<span class="chip ok">ok</span>' : '<span class="chip no">' + esc(u.error || u.status) + '</span>'}</td></tr>`).join('')}</tbody></table></div>
    <div class="panel"><h2>WhatsApp: suscripción de la app a la cuenta (WABA)</h2><div class="sub">Si el webhook se verifica pero no llegan mensajes, suscribe la app a la cuenta de WhatsApp Business.</div>
      <div class="barra"><input id="dg-waba" value="${esc(d.wabaId || '')}" placeholder="ID de la cuenta de WhatsApp Business (WHATSAPP_WABA_ID)"><button class="btn" onclick="repararWaba()">Reparar suscripción</button></div><pre id="dg-waba-res" style="white-space:pre-wrap;font-size:12px"></pre></div>
    <div class="panel"><h2>Seguridad</h2><div id="dg-seg">Cargando…</div></div>`;
  const s = await api('/seguridad');
  $('#dg-seg').innerHTML = `2FA: ${s.totpActivo ? '<span class="chip ok">activo</span>' : '<span class="chip no">inactivo</span> <button class="btn mini" onclick="nuevoTotp()">Generar secreto 2FA</button>'} <div id="totp"></div>
    <table style="margin-top:10px"><thead><tr><th>Cuándo</th><th>IP</th><th>Usuario</th><th>Resultado</th></tr></thead><tbody>${s.intentos.map((x) => `<tr><td>${fecha(x.ts)}</td><td>${esc(x.ip)}</td><td>${esc(x.usuario)}</td><td>${x.ok ? '<span class="chip ok">ok</span>' : '<span class="chip no">' + esc(x.motivo) + '</span>'}</td></tr>`).join('')}</tbody></table>`;
}
async function probarCorreo() { const r = await post('/diagnostico/correo', { to: $('#dg-to').value }); $('#dg-res').innerHTML = r.ok ? '<span class="exito">Enviado ✓</span>' : '<span class="error">' + esc(r.error || 'falló') + '</span>'; }
async function repararWaba() {
  const out = $('#dg-waba-res'); out.textContent = 'Consultando a Meta…';
  const r = await api('/waba/reparar?waba=' + encodeURIComponent($('#dg-waba').value.trim()));
  out.textContent = (r.mensaje || r.error || r.pista || '') + '\n\n' + JSON.stringify(r, null, 2);
}
async function nuevoTotp() { const r = await api('/seguridad/totp/nuevo'); $('#totp').innerHTML = `<div class="aviso">Agrega este secreto en Google Authenticator y ponlo en Render como <code>ADMIN_TOTP_SECRET</code>:<br><code>${esc(r.secreto)}</code><br><small>${esc(r.uri)}</small></div>`; }

ir('resumen');
</script>
