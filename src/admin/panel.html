<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arte'Sano — Panel administrativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap" />
<style>
  :root {
    --tinta: #4A3F35; --verde: #7C8B5D; --verde-osc: #5F6D45; --verde-suave: #E9EFE1; --beige: #C9A876; --crema: #F5EDE0; --blush: #E8C9C0;
    --blanco: #fff; --linea: #E6DCC8; --gris: #8A7F72; --alerta: #B8553F; --ok: #4E8A5C; --aviso: #C08A2E;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--crema); color: var(--tinta); font-size: 14px; }
  a { color: var(--verde); }
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  aside { background: #fff; border-right: 1px solid var(--linea); padding: 18px 14px; position: sticky; top: 0; height: 100vh; }
  .marca { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
  .marca svg { width: 40px; height: 40px; }
  .marca b { display: block; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--verde); }
  .marca small { color: var(--gris); }
  nav button { display: block; width: 100%; text-align: left; background: none; border: none; padding: 10px 12px; border-radius: 10px; font-size: 14px; color: var(--tinta); cursor: pointer; }
  nav button.activo { background: var(--verde-suave); color: var(--verde-osc); font-weight: 700; }
  nav button:hover { background: #f6f2ea; }
  .salir { position: absolute; bottom: 18px; left: 14px; right: 14px; font-size: 12px; color: var(--gris); }
  main { padding: 26px 30px; max-width: 1400px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--gris); margin-bottom: 20px; }
  .tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .tarjeta { background: #fff; border: 1px solid var(--linea); border-radius: 14px; padding: 16px 18px; }
  .tarjeta .k { font-size: 12px; color: var(--gris); text-transform: uppercase; letter-spacing: .08em; }
  .tarjeta .v { font-size: 24px; font-weight: 700; margin-top: 4px; }
  .tarjeta .d { font-size: 12px; color: var(--gris); margin-top: 2px; }
  .panel { background: #fff; border: 1px solid var(--linea); border-radius: 14px; padding: 18px; margin-bottom: 18px; }
  .panel h2 { font-size: 15px; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--linea); vertical-align: middle; }
  th { font-size: 12px; color: var(--gris); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  tr:hover td { background: #fcfaf5; }
  .fila-click { cursor: pointer; }
  .chip { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--crema); color: var(--tinta); }
  .chip.publicado, .chip.pagado, .chip.entregado, .chip.ok { background: #E4F0E6; color: var(--ok); }
  .chip.borrador, .chip.pendiente_pago { background: #FBF0D9; color: var(--aviso); }
  .chip.archivado, .chip.cancelado, .chip.rechazado, .chip.reembolsado, .chip.no { background: #F7E1DC; color: var(--alerta); }
  .chip.enviado, .chip.en_preparacion { background: var(--verde-suave); color: var(--verde-osc); }
  .barra { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .btn { padding: 9px 14px; border-radius: 10px; border: 1px solid var(--linea); background: #fff; color: var(--tinta); font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn.primario { background: var(--verde); border-color: var(--verde); color: #fff; }
  .btn.peligro { color: var(--alerta); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.mini { padding: 5px 9px; font-size: 12px; }
  input, select, textarea { padding: 9px 11px; border: 1px solid var(--linea); border-radius: 9px; font-size: 13px; color: var(--tinta); background: #fcfaf5; font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--verde); border-color: transparent; background: #fff; }
  textarea { width: 100%; min-height: 80px; resize: vertical; }
  .campo { display: flex; flex-direction: column; gap: 5px; }
  .campo label { font-size: 12px; font-weight: 600; color: var(--gris); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .modal-fondo { position: fixed; inset: 0; background: rgba(74,63,53,.45); display: none; align-items: flex-start; justify-content: center; padding: 30px 16px; overflow: auto; z-index: 50; }
  .modal-fondo.abierto { display: flex; }
  .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 980px; padding: 24px 26px; box-shadow: 0 30px 80px rgba(0,0,0,.25); }
  .modal h2 { margin: 0 0 14px; font-size: 18px; }
  .seccion { border-top: 1px solid var(--linea); margin-top: 16px; padding-top: 14px; }
  .seccion h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--verde); margin: 0 0 10px; }
  .miniaturas { display: flex; gap: 10px; flex-wrap: wrap; }
  .miniatura { position: relative; width: 92px; height: 92px; border-radius: 10px; overflow: hidden; border: 1px solid var(--linea); background: var(--crema); }
  .miniatura img { width: 100%; height: 100%; object-fit: cover; }
  .miniatura button { position: absolute; top: 3px; right: 3px; background: rgba(0,0,0,.55); color: #fff; border: none; border-radius: 6px; font-size: 11px; cursor: pointer; }
  .miniatura .principal { position: absolute; bottom: 0; left: 0; right: 0; background: var(--verde); color: #fff; font-size: 10px; text-align: center; }
  .dropzone { border: 2px dashed var(--linea); border-radius: 12px; padding: 16px; text-align: center; color: var(--gris); font-size: 13px; cursor: pointer; }
  .dropzone.sobre { border-color: var(--verde); background: var(--verde-suave); }
  .aviso { background: #FBF0D9; border: 1px solid #EFD9A8; color: #7A5A12; padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; }
  .error { color: var(--alerta); font-weight: 600; font-size: 13px; min-height: 18px; }
  .exito { color: var(--ok); font-weight: 600; font-size: 13px; }
  .img-lista { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--crema); border: 1px solid var(--linea); }
  .pill-int { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--crema); font-size: 12px; margin: 0 6px 6px 0; }
  .pill-int i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--alerta); }
  .pill-int.ok i { background: var(--ok); }
  .chat { display: grid; grid-template-columns: 300px 1fr; gap: 14px; min-height: 420px; }
  .chat-lista { border-right: 1px solid var(--linea); overflow: auto; max-height: 560px; }
  .chat-item { padding: 10px; border-bottom: 1px solid var(--linea); cursor: pointer; }
  .chat-item.activo { background: var(--verde-suave); }
  .burbujas { max-height: 460px; overflow: auto; padding: 10px; background: var(--crema); border-radius: 12px; }
  .burbuja { max-width: 75%; padding: 8px 12px; border-radius: 12px; margin: 6px 0; font-size: 13px; white-space: pre-wrap; }
  .burbuja.in { background: #fff; }
  .burbuja.out { background: var(--verde-suave); margin-left: auto; }
  .detalle-pedido dt { font-size: 12px; color: var(--gris); text-transform: uppercase; letter-spacing: .06em; }
  .detalle-pedido dd { margin: 2px 0 10px; }
  code { background: var(--crema); padding: 2px 6px; border-radius: 6px; font-size: 12px; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } aside { position: static; height: auto; } .grid2, .grid3, .grid4 { grid-template-columns: 1fr; } .chat { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="marca">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="48" fill="#F5EDE0"/>
        <path d="M22 68c1-11 6-20 17-26" fill="none" stroke="#5F6D45" stroke-width="2" stroke-linecap="round"/>
        <g fill="#5F6D45">
          <ellipse cx="25" cy="63" rx="4.6" ry="2.1" transform="rotate(-42 25 63)"/>
          <ellipse cx="29.5" cy="56.5" rx="5.1" ry="2.3" transform="rotate(-34 29.5 56.5)"/>
          <ellipse cx="34" cy="50.5" rx="5.6" ry="2.5" transform="rotate(-26 34 50.5)"/>
          <ellipse cx="38.5" cy="45" rx="6" ry="2.6" transform="rotate(-16 38.5 45)"/>
        </g>
        <text x="33" y="67" font-family="'Playfair Display',Georgia,serif" font-style="italic" font-weight="600" font-size="44" fill="#5F6D45">A</text>
        <text x="49" y="73" font-family="'Playfair Display',Georgia,serif" font-style="italic" font-weight="600" font-size="33" fill="#5F6D45">S</text>
      </svg>
      <div><b>Arte'Sano</b><small>Panel administrativo</small></div>
    </div>
    <nav id="nav">
      <button data-v="resumen" class="activo">Resumen</button>
      <button data-v="productos">Productos</button>
      <button data-v="pedidos">Pedidos</button>
      <button data-v="programados">Pedidos programados</button>
      <button data-v="catalogo">Líneas · Ingredientes · Artesanos</button>
      <button data-v="whatsapp">WhatsApp</button>
      <button data-v="ajustes">Ajustes</button>
      <button data-v="diagnostico">Diagnóstico</button>
    </nav>
    <div class="salir"><span id="usuario"></span> · <a href="/" target="_blank">Ver tienda</a> · <a href="/admin/logout">Salir</a></div>
  </aside>
  <main id="main"></main>
</div>

<div class="modal-fondo" id="modal"><div class="modal" id="modal-cuerpo"></div></div>

<script>
// ============================================================
//  Utilidades
// ============================================================
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cop = (n) => '$' + Math.round(Number(n) || 0).toLocaleString('es-CO');
const dinero = (n, m) => (m === 'USD' ? 'US$ ' + Number(n || 0).toFixed(2) : cop(n));
const fecha = (ts) => (ts ? new Date(ts).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' }) : '');
async function api(ruta, opciones) {
  const r = await fetch('/admin/api' + ruta, { headers: { 'Content-Type': 'application/json' }, ...opciones });
  if (r.status === 401) { window.location.href = '/admin/login'; return {}; }
  return r.json().catch(() => ({ ok: false, error: 'Respuesta inválida' }));
}
const post = (ruta, cuerpo) => api(ruta, { method: 'POST', body: JSON.stringify(cuerpo || {}) });
const main = $('#main');
let CAT = { categorias: [], ingredientes: [], artesanos: [], tiposIva: [] };
function abrirModal(html) { $('#modal-cuerpo').innerHTML = html; $('#modal').classList.add('abierto'); }
function cerrarModal() { $('#modal').classList.remove('abierto'); }
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') cerrarModal(); });

// ============================================================
//  Navegacion
// ============================================================
const vistas = { resumen, productos, pedidos, programados, catalogo, whatsapp, ajustes, diagnostico };
$('#nav').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) ir(b.dataset.v); });
function ir(v) {
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('activo', b.dataset.v === v));
  main.innerHTML = '<p class="sub">Cargando…</p>';
  vistas[v]().catch((e) => (main.innerHTML = '<p class="error">' + esc(e.message) + '</p>'));
}

// ============================================================
//  Resumen
// ============================================================
async function resumen() {
  const d = await api('/resumen');
  $('#usuario').textContent = d.usuario || '';
  const v = d.ventas, c = d.catalogo, i = d.integraciones;
  const pill = (ok, n) => `<span class="pill-int ${ok ? 'ok' : ''}"><i></i>${n}</span>`;
  main.innerHTML = `
    <h1>Resumen</h1><div class="sub">Así va ${esc(d.tienda)} hoy.</div>
    <div class="tarjetas">
      <div class="tarjeta"><div class="k">Ventas hoy</div><div class="v">${cop(v.hoy.COP)}</div><div class="d">${v.hoy.pedidos} pedidos${v.hoy.USD ? ' · US$ ' + v.hoy.USD.toFixed(2) : ''}</div></div>
      <div class="tarjeta"><div class="k">Esta semana</div><div class="v">${cop(v.semana.COP)}</div><div class="d">${v.semana.pedidos} pedidos${v.semana.USD ? ' · US$ ' + v.semana.USD.toFixed(2) : ''}</div></div>
      <div class="tarjeta"><div class="k">Este mes</div><div class="v">${cop(v.mes.COP)}</div><div class="d">${v.mes.pedidos} pedidos${v.mes.USD ? ' · US$ ' + v.mes.USD.toFixed(2) : ''}</div></div>
      <div class="tarjeta"><div class="k">Por preparar</div><div class="v">${v.porPreparar}</div><div class="d">${v.pendientesPago} pendientes de pago · ${v.programados} programados</div></div>
      <div class="tarjeta"><div class="k">Catálogo</div><div class="v">${c.publicados}</div><div class="d">publicados · ${c.borradores} borradores · ${c.bajoStock} con bajo stock</div></div>
    </div>
    <div class="panel"><h2>Integraciones</h2>
      ${pill(i.db, 'PostgreSQL')}${pill(i.rapyd, 'RAPYD' + (i.rapydSandbox && i.rapyd ? ' (sandbox)' : ''))}${pill(i.resend, 'Resend')}${pill(i.whatsapp, 'WhatsApp')}${pill(i.cloudinary, 'Cloudinary')}${pill(i.ia, 'Claude (IA)')}
      <div class="sub" style="margin:8px 0 0">URL pública: <code>${esc(i.publicUrl)}</code></div>
    </div>
    <div class="grid2">
      <div class="panel"><h2>Últimos pedidos</h2>
        <table><thead><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Estado</th></tr></thead><tbody>
        ${d.ultimosPedidos.map((p) => `<tr class="fila-click" onclick="verPedido(${p.id})"><td><b>${esc(p.numero)}</b><br><small>${fecha(p.creado)}</small></td><td>${esc(p.cliente)}</td><td>${dinero(p.total, p.moneda)}</td><td><span class="chip ${p.estado}">${esc(p.estadoNombre)}</span></td></tr>`).join('') || '<tr><td colspan="4" class="sub">Aún no hay pedidos.</td></tr>'}
        </tbody></table></div>
      <div class="panel"><h2>Bajo stock</h2>
        <table><thead><tr><th>Producto</th><th>SKU</th><th>Stock</th></tr></thead><tbody>
        ${d.bajoStock.map((b) => `<tr class="fila-click" onclick="editarProducto(${b.productoId})"><td>${esc(b.producto)} · ${esc(b.variante)}</td><td><code>${esc(b.sku)}</code></td><td><b style="color:var(--alerta)">${b.stock}</b></td></tr>`).join('') || '<tr><td colspan="3" class="sub">Todo con stock suficiente.</td></tr>'}
        </tbody></table></div>
    </div>`;
}

// ============================================================
//  Productos
// ============================================================
async function cargarCat() { CAT = await api('/catalogo'); }
async function productos() {
  await cargarCat();
  const d = await api('/productos');
  const lista = d.productos || [];
  const cat = (id) => CAT.categorias.find((c) => c.id === id)?.nombre || '—';
  main.innerHTML = `
    <h1>Productos</h1><div class="sub">Crea, edita y publica los productos de la tienda. El precio se ingresa con IVA incluido.</div>
    <div class="barra">
      <button class="btn primario" onclick="editarProducto()">+ Nuevo producto</button>
      <input id="buscar" placeholder="Buscar por nombre o SKU…" style="min-width:260px" />
      <select id="f-estado"><option value="">Todos los estados</option><option value="publicado">Publicados</option><option value="borrador">Borradores</option><option value="archivado">Archivados</option></select>
    </div>
    <div class="panel"><table><thead><tr><th></th><th>Producto</th><th>Línea</th><th>Precio</th><th>IVA</th><th>Stock</th><th>Estado</th><th></th></tr></thead><tbody id="tabla"></tbody></table></div>`;
  const pintar = () => {
    const q = $('#buscar').value.toLowerCase(), fe = $('#f-estado').value;
    $('#tabla').innerHTML = lista
      .filter((p) => (!fe || p.estado === fe) && (!q || (p.nombre + ' ' + p.variantes.map((v) => v.sku).join(' ')).toLowerCase().includes(q)))
      .map((p) => `<tr>
        <td>${p.imagenPrincipal ? `<img class="img-lista" src="${esc(p.imagenPrincipal)}">` : '<div class="img-lista"></div>'}</td>
        <td><b>${esc(p.nombre)}</b>${p.destacado ? ' ⭐' : ''}<br><small>${p.variantes.map((v) => esc(v.sku)).join(', ')}</small></td>
        <td>${esc(cat(p.categoriaId))}</td>
        <td>${cop(p.precioDesde)}${p.precioUsd ? '<br><small>US$ ' + p.precioUsd + '</small>' : ''}</td>
        <td><small>${esc(CAT.tiposIva.find((t) => t.valor === p.tipoIva)?.nombre || p.tipoIva)}</small></td>
        <td>${p.stockTotal}</td>
        <td><span class="chip ${p.estado}">${p.estado}</span></td>
        <td style="white-space:nowrap"><button class="btn mini" onclick="editarProducto(${p.id})">Editar</button>
          ${p.estado !== 'publicado' ? `<button class="btn mini" onclick="cambiarEstado(${p.id},'publicado')">Publicar</button>` : `<button class="btn mini" onclick="cambiarEstado(${p.id},'borrador')">Ocultar</button>`}
          ${p.estado !== 'archivado' ? `<button class="btn mini peligro" onclick="cambiarEstado(${p.id},'archivado')">Archivar</button>` : ''}</td></tr>`)
      .join('') || '<tr><td colspan="8" class="sub">Sin productos.</td></tr>';
  };
  $('#buscar').addEventListener('input', pintar); $('#f-estado').addEventListener('change', pintar); pintar();
}
async function cambiarEstado(id, estado) {
  const r = await post(`/productos/${id}/estado`, { estado });
  if (!r.ok) alert(r.error); else productos();
}

let P = null; // producto en edicion
async function editarProducto(id) {
  if (!CAT.categorias.length) await cargarCat();
  P = id ? (await api('/productos/' + id)).producto : {
    nombre: '', descripcionCorta: '', descripcion: '', beneficios: '', modoUso: '', advertencias: '', categoriaId: CAT.categorias[0]?.id || null, artesanoId: null,
    ingredienteIds: [], ingredienteProtagonistaId: null, tipoIva: CAT.ivaPorDefecto, precioIncluyeIva: true, precioCop: 0, precioComparacionCop: '', precioUsd: '', precioMayoristaCop: '',
    pesoGramos: 0, invima: '', tipoPiel: [], etiquetas: [], estado: 'borrador', destacado: false, variantes: [{ sku: '', nombre: 'Único', precioCop: 0, precioUsd: '', stock: 0, umbralStock: 5, imagenUrl: '', porDefecto: true }], imagenes: [], seoTitulo: '', seoDescripcion: '' };
  const opt = (arr, sel) => arr.map((x) => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${esc(x.nombre)}</option>`).join('');
  abrirModal(`
    <h2>${id ? 'Editar producto' : 'Nuevo producto'}</h2>
    <div class="grid3">
      <div class="campo" style="grid-column:span 2"><label>Nombre *</label><input id="p-nombre" value="${esc(P.nombre)}" placeholder="Jabón de Arroz"></div>
      <div class="campo"><label>Estado</label><select id="p-estado">${['borrador', 'publicado', 'archivado'].map((e) => `<option ${P.estado === e ? 'selected' : ''}>${e}</option>`).join('')}</select></div>
      <div class="campo"><label>Línea (categoría) *</label><select id="p-categoria">${opt(CAT.categorias, P.categoriaId)}</select></div>
      <div class="campo"><label>Artesano</label><select id="p-artesano"><option value="">—</option>${opt(CAT.artesanos, P.artesanoId)}</select></div>
      <div class="campo"><label>Destacado en inicio</label><select id="p-destacado"><option value="0">No</option><option value="1" ${P.destacado ? 'selected' : ''}>Sí</option></select></div>
    </div>
    <div class="seccion"><h3>Descripción</h3>
      <div class="campo"><label>Descripción corta (máx. 300)</label><input id="p-corta" value="${esc(P.descripcionCorta)}" maxlength="300"></div>
      <div class="grid2" style="margin-top:10px">
        <div class="campo"><label>Descripción larga (HTML permitido: p, ul, li, b, i)</label><textarea id="p-desc">${esc(P.descripcion)}</textarea></div>
        <div class="campo"><label>Beneficios</label><textarea id="p-benef">${esc(P.beneficios)}</textarea></div>
        <div class="campo"><label>Modo de uso</label><textarea id="p-uso">${esc(P.modoUso)}</textarea></div>
        <div class="campo"><label>Advertencias</label><textarea id="p-adv">${esc(P.advertencias)}</textarea></div>
      </div></div>
    <div class="seccion"><h3>Ingredientes ancestrales</h3>
      <div class="grid2">
        <div class="campo"><label>Ingredientes (mantén Ctrl para varios)</label><select id="p-ings" multiple size="5">${CAT.ingredientes.map((i) => `<option value="${i.id}" ${(P.ingredienteIds || []).includes(i.id) ? 'selected' : ''}>${esc(i.nombre)}</option>`).join('')}</select></div>
        <div class="campo"><label>Ingrediente protagonista</label><select id="p-prota"><option value="">—</option>${opt(CAT.ingredientes, P.ingredienteProtagonistaId)}</select>

function desglose() {
  const precio = Number($('#p-precio').value) || 0, tipo = $('#p-iva').value, incl = $('#p-incl').value === '1';
  const tasa = { iva_19: 0.19, iva_5: 0.05 }[tipo] || 0;
  const base = incl ? precio / (1 + tasa) : precio, iva = incl ? precio - base : precio * tasa, total = incl ? precio : precio + iva;
  $('#p-desglose').textContent = `Desglose: base ${cop(base)} + IVA ${cop(iva)} = ${cop(total)} al cliente en Colombia. Exportación: ${cop(base)} sin IVA.`;
}
function pintarVariantes() {
  $('#p-vars').innerHTML = P.variantes.map((v, i) => `<tr>
    <td><input value="${esc(v.sku)}" data-i="${i}" data-k="sku" style="width:130px" placeholder="AS-ARROZ-100"></td>

    <td><input type="number" value="${v.precioCop ?? ''}" data-i="${i}" data-k="precioCop" style="width:100px"></td>

    <td><input type="number" value="${v.stock ?? 0}" data-i="${i}" data-k="stock" style="width:70px"></td>
    <td><input type="number" value="${v.umbralStock ?? 5}" data-i="${i}" data-k="umbralStock" style="width:60px"></td>
    <td><input value="${esc(v.imagenUrl || '')}" data-i="${i}" data-k="imagenUrl" style="width:150px"></td>
    <td><input type="radio" name="vdef" ${v.porDefecto ? 'checked' : ''} onchange="P.variantes.forEach((x,j)=>x.porDefecto=j===${i})"></td>
    <td><button class="btn mini peligro" onclick="P.variantes.splice(${i},1);pintarVariantes()">✕</button></td></tr>`).join('');
  $('#p-vars').querySelectorAll('input[data-k]').forEach((inp) => inp.addEventListener('input', () => { P.variantes[inp.dataset.i][inp.dataset.k] = inp.value; }));
}
function agregarVariante() { P.variantes.push({ sku: '', nombre: '', precioCop: Number($('#p-precio').value) || 0, precioUsd: '', stock: 0, umbralStock: 5, imagenUrl: '', porDefecto: !P.variantes.length }); pintarVariantes(); }
function pintarImagenes() {
  $('#p-imgs').innerHTML = P.imagenes.map((im, i) => `<div class="miniatura"><img src="${esc(im.url)}" title="${esc(im.alt || '')}"><button onclick="P.imagenes.splice(${i},1);pintarImagenes()">✕</button>${i === 0 ? '<div class="principal">principal</div>' : `<div class="principal" style="background:#aaa;cursor:pointer" onclick="const x=P.imagenes.splice(${i},1)[0];P.imagenes.unshift(x);pintarImagenes()">hacer principal</div>`}</div>`).join('');
}
function agregarImagenUrl() { const u = $('#p-img-url').value.trim(); if (/^https?:\/\//.test(u)) { P.imagenes.push({ url: u, alt: '' }); $('#p-img-url').value = ''; pintarImagenes(); } }
async function subirImagenes(files) {
  const f = await api('/subidas/firma');
  if (!f.ok) { $('#p-error').textContent = f.error; return; }
  for (const file of files) {
    const fd = new FormData();
    fd.append('file', file); fd.append('api_key', f.apiKey); fd.append('timestamp', f.timestamp); fd.append('signature', f.signature); fd.append('folder', f.folder);
    try {
      const r = await fetch(f.url, { method: 'POST', body: fd }).then((x) => x.json());
      if (r.secure_url) { P.imagenes.push({ url: r.secure_url, alt: $('#p-nombre').value }); pintarImagenes(); }
      else $('#p-error').textContent = r.error?.message || 'No se pudo subir la imagen.';
    } catch (e) { $('#p-error').textContent = 'Error subiendo: ' + e.message; }
  }
}

      ${WA.modo === 'humano' ? `<button class="btn mini" onclick="modoChat('bot')">Devolver al bot</button>` : `<button class="btn mini primario" onclick="modoChat('humano')">Tomar control</button>`}
      ${WA.ventanaAbierta ? '<span class="chip ok">ventana 24 h abierta</span>' : '<span class="chip no">ventana cerrada</span>'}</div>
    <div class="burbujas" id="burbujas">${WA.mensajes.map((m) => `<div class="burbuja ${m.direccion}"><small style="color:var(--gris)">${esc(m.autor)} · ${fecha(m.ts)}</small><br>${esc(m.texto)}</div>`).join('')}</div>
    <div class="barra" style="margin-top:10px"><input id="wa-texto" placeholder="Escribe una respuesta…" style="flex:1"><button class="btn primario" onclick="responderChat()">Enviar</button><span class="error" id="wa-error"></span></div>`;
  const b = $('#burbujas'); b.scrollTop = b.scrollHeight;
}
async function modoChat(modo) { await post(`/conversaciones/${WA.waId}/modo`, { modo }); abrirChat(WA.waId); }
async function responderChat() {
  const r = await post(`/conversaciones/${WA.waId}/responder`, { texto: $('#wa-texto').value });
  if (!r.ok) { $('#wa-error').textContent = r.error; return; }
  abrirChat(WA.waId);
}

// ============================================================
//  Ajustes
// ============================================================
async function ajustes() {
  const d = await api('/ajustes');
  const a = d.ajustes;
  main.innerHTML = `<h1>Ajustes</h1><div class="sub">Textos del inicio, tarifas de envío y reglas de pedidos programados.</div>
    <div class="panel"><h2>Inicio</h2><div class="grid2">
      <div class="campo"><label>Título principal</label><input id="i-titulo" value="${esc(a.inicio.titulo)}"></div>
      <div class="campo"><label>Subtítulo</label><input id="i-sub" value="${esc(a.inicio.subtitulo)}"></div></div>
      <div class="barra" style="margin-top:10px"><button class="btn primario" onclick="guardarAjuste('inicio',{titulo:$('#i-titulo').value, subtitulo:$('#i-sub').value})">Guardar</button></div></div>
    <div class="panel"><h2>Envíos</h2><div class="grid3">
      <div class="campo"><label>Tarifa ciudades principales (COP)</label><input id="e-p" type="number" value="${a.envio.tarifaPrincipalCop}"></div>
      <div class="campo"><label>Tarifa resto del país (COP)</label><input id="e-r" type="number" value="${a.envio.tarifaRestoCop}"></div>
      <div class="campo"><label>Transportadora nacional</label><input id="e-tn" value="${esc(a.envio.transportadoraNacional)}"></div>
      <div class="campo"><label>Tiempo ciudades principales</label><input id="e-dp" value="${esc(a.envio.diasPrincipal)}"></div>
      <div class="campo"><label>Tiempo resto del país</label><input id="e-dr" value="${esc(a.envio.diasResto)}"></div>
      <div class="campo"><label>Transportadora internacional</label><input id="e-ti" value="${esc(a.envio.transportadoraInternacional)}"></div>
      <div class="campo" style="grid-column:span 3"><label>Ciudades principales (slugs separados por coma)</label><input id="e-cp" value="${esc(a.envio.ciudadesPrincipales.join(', '))}"></div>
      ${a.envio.zonas.map((z, i) => `<div class="campo"><label>${esc(z.nombre)} · tarifa USD</label><input id="e-z${i}" type="number" step="0.01" value="${z.tarifaUsd}"><small>${esc(z.dias)}</small></div>`).join('')}
    </div><div class="barra" style="margin-top:10px"><button class="btn primario" onclick="guardarEnvio()">Guardar envíos</button></div></div>
    <div class="panel"><h2>Pedidos programados</h2><div class="grid2">
      <div class="campo"><label>Mínimo de días de anticipación</label><input id="pp-min" type="number" value="${a.pedidosProgramados.minDias}"></div>
      <div class="campo"><label>Máximo de días</label><input id="pp-max" type="number" value="${a.pedidosProgramados.maxDias}"></div></div>
      <div class="barra" style="margin-top:10px"><button class="btn primario" onclick="guardarAjuste('pedidosProgramados',{minDias:Number($('#pp-min').value), maxDias:Number($('#pp-max').value)})">Guardar</button></div></div>`;
  window.__envio = a.envio;
}
async function guardarAjuste(clave, valor) { const r = await post('/ajustes', { clave, valor }); if (!r.ok) alert(r.error); else ajustes(); }
function guardarEnvio() {
  const e = { ...window.__envio, tarifaPrincipalCop: Number($('#e-p').value), tarifaRestoCop: Number($('#e-r').value), transportadoraNacional: $('#e-tn').value, diasPrincipal: $('#e-dp').value, diasResto: $('#e-dr').value, transportadoraInternacional: $('#e-ti').value,
    ciudadesPrincipales: $('#e-cp').value.split(',').map((s) => s.trim()).filter(Boolean), zonas: window.__envio.zonas.map((z, i) => ({ ...z, tarifaUsd: Number($('#e-z' + i).value) })) };
  guardarAjuste('envio', e);
}

// ============================================================
//  Diagnostico
// ============================================================
async function diagnostico() {
  main.innerHTML = '<h1>Diagnóstico</h1><div class="sub">Probando conexiones…</div>';
  const d = await api('/diagnostico?rapyd=1');
  const i = d.integraciones;
  const fila = (k, v) => `<tr><td>${k}</td><td>${v}</td></tr>`;
  main.innerHTML = `<h1>Diagnóstico</h1><div class="sub">Estado de las integraciones.</div>
    <div class="panel"><table><tbody>
      ${fila('PostgreSQL', d.db.activo ? `<span class="chip ok">activa</span> ${esc(JSON.stringify(d.db.catalogo || {}))} · ${d.db.pedidos} pedidos · ${d.db.mensajes} mensajes` : '<span class="chip no">en memoria</span>')}
      ${fila('RAPYD', d.rapyd ? (d.rapyd.ok ? `<span class="chip ok">${esc(d.rapyd.mensaje)}</span> ${esc(d.rapyd.baseUrl)}` : `<span class="chip no">${esc(d.rapyd.error)}</span>`) : '')}
      ${fila('Métodos de pago (CO/COP)', d.metodosRapyd ? (d.metodosRapyd.ok ? `${d.metodosRapyd.cantidad}: ${esc((d.metodosRapyd.metodos || []).join(', '))}` : esc(d.metodosRapyd.error)) : '')}
      ${fila('Resend', i.resend ? `<span class="chip ok">configurado</span> remitente ${esc(d.correo.remitente)}` : '<span class="chip no">sin API key</span>')}
      ${fila('WhatsApp', i.whatsapp ? '<span class="chip ok">configurado</span>' : '<span class="chip no">sin credenciales</span>')}
      ${fila('Cloudinary', i.cloudinary ? '<span class="chip ok">configurado</span>' : '<span class="chip no">no configurado (imágenes por URL)</span>')}
    </tbody></table></div>
    <div class="panel"><h2>Probar correo</h2><div class="barra"><input id="dg-to" placeholder="correo@destino.com"><button class="btn" onclick="probarCorreo()">Enviar prueba</button><span id="dg-res"></span></div>
      <table><thead><tr><th>Cuándo</th><th>Para</th><th>Asunto</th><th>Resultado</th></tr></thead><tbody>${(d.correo.ultimos || []).map((u) => `<tr><td>${esc(u.cuando)}</td><td>${esc(u.to)}</td><td>${esc(u.subject)}</td><td>${u.ok ? '<span class="chip ok">ok</span>' : '<span class="chip no">' + esc(u.error || u.status) + '</span>'}</td></tr>`).join('')}</tbody></table></div>
    <div class="panel"><h2>Seguridad</h2><div id="dg-seg">Cargando…</div></div>`;
  const s = await api('/seguridad');
  $('#dg-seg').innerHTML = `2FA: ${s.totpActivo ? '<span class="chip ok">activo</span>' : '<span class="chip no">inactivo</span> <button class="btn mini" onclick="nuevoTotp()">Generar secreto 2FA</button>'} <div id="totp"></div>
    <table style="margin-top:10px"><thead><tr><th>Cuándo</th><th>IP</th><th>Usuario</th><th>Resultado</th></tr></thead><tbody>${s.intentos.map((x) => `<tr><td>${fecha(x.ts)}</td><td>${esc(x.ip)}</td><td>${esc(x.usuario)}</td><td>${x.ok ? '<span class="chip ok">ok</span>' : '<span class="chip no">' + esc(x.motivo) + '</span>'}</td></tr>`).join('')}</tbody></table>`;
}
async function probarCorreo() { const r = await post('/diagnostico/correo', { to: $('#dg-to').value }); $('#dg-res').innerHTML = r.ok ? '<span class="exito">Enviado ✓</span>' : '<span class="error">' + esc(r.error || 'falló') + '</span>'; }
async function nuevoTotp() { const r = await api('/seguridad/totp/nuevo'); $('#totp').innerHTML = `<div class="aviso">Agrega este secreto en Google Authenticator y ponlo en Render como <code>ADMIN_TOTP_SECRET</code>:<br><code>${esc(r.secreto)}</code><br><small>${esc(r.uri)}</small></div>`; }

ir('resumen');
</script>
</body>
